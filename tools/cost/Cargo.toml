[package]
name = "cost"
description = "Cost harness: cycles and gas (cost-exec), proving time and RSS (cost-prove) (W6)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Executor only (risc0-zkvm `client`, no `prove` feature): turning on `prove` here would unify into every host
# crate built with this one and switch LEZ's default prover from the external r0vm to the in-process one.
[dependencies]
anyhow.workspace = true
attest_core = { workspace = true, features = ["lc", "v3"] }
borsh.workspace = true
e2e_chain = { path = "../../tests/e2e_chain" }
lee_core.workspace = true
risc0-zkvm = { workspace = true, features = ["client"] }
risc0-binfmt = "=3.0.4"
risc0-zkos-v1compat = "=2.2.2"
serde_json.workspace = true
hex.workspace = true
ethereum_ssz = "0.9"
# bench-bls only (guests/bls_bench types and witness builders, fixtures loader).
bls_bench_guest = { path = "../../guests/bls_bench" }
fixtures = { path = "../fixtures" }
# g1_real_proof only (host, wallet to seq-real).
attest_host.workspace = true
common.workspace = true
tokio.workspace = true
