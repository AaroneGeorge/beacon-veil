# Checks crates/lez_chain against LEZ v0.4.0-rc3's own block types on real chains, and lists where bridge burns show
# in block bytes. Own workspace (not a member of the root workspace); LEZ pinned like the root (tag v0.4.0-rc3).
[workspace]

[package]
name = "lez_chain_probe"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
lez_chain = { path = "../../crates/lez_chain" }
bridge_program = { path = "../../programs/bridge" }
common = { git = "https://github.com/logos-blockchain/logos-execution-zone", tag = "v0.4.0-rc3" }
lee = { git = "https://github.com/logos-blockchain/logos-execution-zone", tag = "v0.4.0-rc3" }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone", tag = "v0.4.0-rc3", features = ["host"] }
borsh = { version = "1.5.7", features = ["derive"] }
hex = "0.4.3"
serde_json = "1.0.81"

# Same patches as the root workspace, so LEZ's crates resolve to the versions in the root Cargo.lock.
[patch.crates-io]
keccak = { git = "https://github.com/logos-blockchain/sponges", rev = "3a56e99771beedf04946eab21a4a62adc2951377" }
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }

[profile.release]
opt-level = 3
debug = false
