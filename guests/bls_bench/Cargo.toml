[package]
name = "bls_bench_guest"
description = "Measurement guest (never deployed): cycles of each BLS phase and of a whole light-client update, zkcrypto against blst, hashed against cached committee"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "bls_bench"
path = "src/bin/bls_bench.rs"

[dependencies]
attest_core = { workspace = true, features = ["lc", "v2"] }
bls_blst.workspace = true
borsh.workspace = true
risc0-zkvm.workspace = true
sha2.workspace = true
# Same crates and versions as attest_core's `v2` path (the zkcrypto columns).
alloy-primitives.workspace = true
bls12_381 = { version = "0.8", features = ["experimental"] }
sha2_v09 = { package = "sha2", version = "0.9" }
helios-consensus-core.workspace = true
ethereum_ssz = "0.9"
tree_hash = "0.10"

[dev-dependencies]
fixtures = { path = "../../tools/fixtures" }
helios-consensus-core.workspace = true
