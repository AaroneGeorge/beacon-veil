[package]
name = "burn_proof_r31"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[[bin]]
name = "burn_proof"
path = "src/main.rs"

[dependencies]
borsh = { version = "1.5.7", features = ["derive"] }
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ["std"] }
sha2 = { version = "0.10.8", default-features = false }

[patch.crates-io]
# RISC Zero accelerated SHA-256, the same fork the root workspace uses (PLAN.md 2.1).
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
