[package]
name = "diff_helios"
description = "Differential test: unmodified Helios 0.12.0 and each verifier column on real mainnet, Sepolia (Gloas) and Hoodi (Fulu) updates, tampered copies and a fabricated chain"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "diff_report"
path = "src/bin/diff_report.rs"

# The executor pass: every case through the lc_verify_v3 guest in the RISC Zero executor (slow; separate run).
[[bin]]
name = "diff_exec"
path = "src/bin/diff_exec.rs"
required-features = ["executor"]

[dependencies]
anyhow.workspace = true
attest_core = { workspace = true, features = ["lc", "v2"] }
borsh.workspace = true
fixtures = { path = "../../tools/fixtures" }
hex.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, features = ["std"] }

# Same versions as tools/fixtures (Helios 0.12.0's own workspace); `bls12_381` resolves to the RISC Zero fork.
alloy-primitives = { workspace = true, features = ["std"] }
bls12_381 = { version = "0.8.0", features = ["experimental"] }
ethereum_ssz = "0.9"
eyre = "0.6"
helios-consensus-core.workspace = true

# Executor pass only (feature `executor`): the external r0vm executor (`client`, no `prove`), LEZ input framing.
lee_core = { workspace = true, optional = true }
risc0-zkvm = { workspace = true, features = ["client"], optional = true }
risc0-binfmt = { version = "=3.0.4", optional = true }
risc0-zkos-v1compat = { version = "=2.2.2", optional = true }

[features]
# V3 columns (attest_core::lc_v3). On by default, so every run (also `make test-host`) writes the same report.
default = ["v3"]
v3 = ["attest_core/v3"]
executor = ["v3", "dep:lee_core", "dep:risc0-zkvm", "dep:risc0-binfmt", "dep:risc0-zkos-v1compat"]
