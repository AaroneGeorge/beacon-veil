[package]
name = "e2e_consumer"
description = "End-to-end consumer: attestation consumed once, replay refused with E11; Attest/consumer cycle harness"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "attest_exec"
path = "src/bin/attest_exec.rs"

[[bin]]
name = "g3_real"
path = "src/bin/g3_real.rs"

[dependencies]
anyhow.workspace = true
attest_core.workspace = true
attest_host.workspace = true
common.workspace = true
tokio.workspace = true
attest_inclusion.workspace = true
borsh.workspace = true
consumer_erc20_program = { path = "../../programs/consumer_erc20" }
hex.workspace = true
lee_core.workspace = true
risc0-zkvm = { workspace = true, features = ["client"] }
risc0-binfmt = "=3.0.4"
risc0-zkos-v1compat = "=2.2.2"
serde_json.workspace = true

[dev-dependencies]
e2e_chain = { path = "../e2e_chain" }
toml.workspace = true
