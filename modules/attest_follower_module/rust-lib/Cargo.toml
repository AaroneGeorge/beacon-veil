[package]
name = "attest_follower_module"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
# The builder compiles with the nixpkgs rustc (1.89 in logos-module-builder 0.3.2).
rust-version = "1.89"

# Standalone crate, not a member of the beacon-veil workspace (the builder compiles it with its own toolchain).
[workspace]

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = ["logos"]
# Off for `cargo test --no-default-features`: the supervisor logic without the Logos SDK.
logos = ["dep:logos-rust-sdk"]

[dependencies]
serde_json = "1"
# Staged by the builder (same revision as its code generator).
logos-rust-sdk = { path = "../logos-rust-sdk-src", optional = true }
