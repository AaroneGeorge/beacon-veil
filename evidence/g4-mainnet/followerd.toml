# attest-followerd config: run C, Ethereum MAINNET (chain_id 1) beacon chain into an instance on seq-dev
# (standalone LEZ v0.4.0-rc3 sequencer, RISC0_DEV_MODE=1: dev-mode receipts, no real proofs).
# Template: run/w4/run-b/followerd.toml (Sepolia run B). Same cadence, poll, jitter, quorum, source kind.

[follower]
echo = false

id = "run-c"
chain_id = 1
state_dir = "/home/lechuuu/hackathons/logos-rfp/build/run/w4/run-c"
# log_file defaults to <state_dir>/follower.jsonl
cadence_s = 6144        # 16 epochs: one finality update per ~1.7 h; handoffs go at once
poll_s = 300            # one tick line every 5 min
jitter_max_s = 60       # per-instance deferral before each submission
min_participation = 342 # 2/3 of 512 (Helios applies only with a supermajority)

[source]
kind = "logos_module"
logosctl = "/home/lechuuu/hackathons/logos-rfp/build/run/w4/logosctl/squashfs-root/AppRun"  # logosctl 0.3.2
logosctl_config_dir = "/home/lechuuu/hackathons/logos-rfp/build/run/w4/logos-session"
logosctl_tmpdir = "/home/lechuuu/hackathons/logos-rfp/build/.tmp"   # TMPDIR the session daemon was started with
provider = ""           # module's order: lodestar (https) first, then nimbus testing/unstable
timeout_s = 60
# Used only when kind = "direct_http": mainnet providers with the light-client API (checked 2026-11-17).
endpoints = ["https://lodestar-mainnet.chainsafe.io", "http://unstable.mainnet.beacon-api.nimbus.team"]

[chain]
kind = "host"
instance = "HkTRK41GMDEpuNSP4wEbDhYEqw8pxmZhoJu3GXzZ4Exn"
mode = "private"        # Path A
