# attest-followerd config: Sepolia instance on seq-dev (run A). Paths are absolute on purpose (the daemon may be
# started by logosctl or a launcher from any directory). scripts/run_a.sh writes the real one into the state dir.

[follower]
id = "run-a"
chain_id = 11155111
state_dir = "${BUILD}/run/w4/run-a"
# log_file defaults to <state_dir>/follower.jsonl
cadence_s = 6144        # 16 epochs: one finality update per ~1.7 h; handoffs go at once
poll_s = 300            # one tick line every 5 min: the G4 gap limit is 2 x cadence
jitter_max_s = 60       # per-instance deferral before each submission
min_participation = 342 # 2/3 of 512 (Helios applies only with a supermajority)

[source]
kind = "logos_module"   # or "direct_http" (stated fallback, K8)
logosctl = "${BUILD}/run/w4/logosctl/squashfs-root/AppRun"  # logosctl 0.3.2, extracted once
logosctl_config_dir = "${BUILD}/run/w4/logos-session"
logosctl_tmpdir = "${BUILD}/.tmp"   # TMPDIR the session daemon was started with (scripts/env.sh)
provider = ""           # module's order: lodestar (https) first
timeout_s = 60
# Used when kind = "direct_http": the same public providers beacon_api_module seeds for Sepolia.
endpoints = ["https://lodestar-sepolia.chainsafe.io", "http://unstable.sepolia.beacon-api.nimbus.team"]

[chain]
kind = "host"
instance = "REPLACE_WITH_INSTANCE_ID"
# ids_file defaults to $BV_IDS or $BV_REPO/deploy/ids.toml
mode = "private"        # Path A; "public_probe" = B0
