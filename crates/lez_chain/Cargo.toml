# Parses LEZ v0.4.0-rc3 blocks from their borsh bytes, recomputes block hashes, checks hash chains and finds bridge
# burns. No LEZ dependency (borsh and sha2 only), so the same code runs natively and in a RISC Zero guest.
# Own workspace root: used by path from tools/lez_chain_probe and guests/burn_chain, not a member of the root workspace.
[workspace]

[package]
name = "lez_chain"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
borsh = { version = "1.5.7", default-features = false, features = ["derive"] }
sha2 = { version = "0.10.8", default-features = false }

[dev-dependencies]
serde_json = "1.0.81"
