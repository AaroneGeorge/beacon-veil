[package]
name = "guest_methods"
description = "Builds every guest for riscv32im-risc0-zkvm-elf and embeds ELF + image id (W0). RISC0_SKIP_BUILD=1 skips; BV_GUEST_DOCKER=1 builds in the pinned Docker image"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[build-dependencies]
risc0-build.workspace = true

# Package names of the guests embedded here. Do not edit: owned by W0 so that no track edits it.
[package.metadata.risc0]
methods = [
  "../../programs/attest",
  "../../programs/lc_verify",
  "../../programs/consumer_erc20",
  "../../programs/bridge",
  "../../guests/burn_proof",
  "../../programs/lc_verify_v3",
]
